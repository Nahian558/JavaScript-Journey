<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <p class="title">Temperature Converter</p>

        <div class="restPart">
          <div class="inputTemp">
            <label for="inTemp" class="input">Enter Temperature: </label>
            <input type="number" id="inTemp" class="box" value="0" /><br />
          </div>

          <div class="conversion">
            <div class="celsius">
              <input type="radio" id="toCelcius" name="convert" />
              <label for="toCelcius">Fahrenheit ➡️ Celsius</label>
            </div>

            <div class="farenheite">
              <input type="radio" id="toFahrenheit" name="convert" />
              <label for="toFahrenheit">Celsius ➡️ Fahrenheit</label>
            </div>
          </div>

          <button onclick="convert()">Submit</button>

          <p class="answer" id="answer"></p>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
