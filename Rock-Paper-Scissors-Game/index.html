<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock-Paper-Scissors Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <p class="title">Rock - Paper - Scissors</p>

      <button onclick="playGame('Rock')"><img src="images/rock.png" /></button>
      <button onclick="playGame('Paper')">
        <img src="images/paper.png" />
      </button>
      <button onclick="playGame('Scissors')">
        <img src="images/scissors.png" />
      </button>

      <div class="turn" id="yTurn">Your Turn:</div>

      <div class="turn" id="cTurn">Computer's Turn:</div>

      <div id="result">Make a guess</div>

      <div class="score">Your Score:</div>
      <span id="yourScore">0</span>

      <br />

      <div class="score">Computer Score:</div>
      <span id="computerScore">0</span><br />
    </div>

    <script src="index.js"></script>
  </body>
</html>
